name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    name: Formula (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      # setup-homebrew taps this repository, so each formula in Formula/ is available by name.
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Audit, install and test every formula
        run: |
          for path in Formula/*.rb; do
            formula="cniska/tap/$(basename "$path" .rb)"
            brew audit --strict --formula "$formula"
            brew install "$formula"
            brew test "$formula"
          done
