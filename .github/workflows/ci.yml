name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    name: Formula (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      # setup-homebrew taps this repository, so the formula is available by name.
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Audit
        run: brew audit --strict --formula cniska/tap/acolyte

      - name: Install
        run: brew install cniska/tap/acolyte

      - name: Test
        run: brew test cniska/tap/acolyte
